name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build

      - name: Run backend lint
        run: |
          if [ -f package.json ]; then
            echo "No backend linter configured. Skipping.";
          fi

      - name: Run basic server smoke check
        run: |
          node -e "const app = require('./server/index.js'); console.log('server file loads');"
