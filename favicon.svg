<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12172b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Terminal Window Symbol -->
  <rect x="20" y="25" width="60" height="45" rx="4" fill="none" stroke="url(#iconGrad)" stroke-width="2.5"/>
  
  <!-- Terminal Prompt Symbol -->
  <path d="M 28 38 L 35 45 L 28 52" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cursor Line -->
  <line x1="42" y1="45" x2="52" y2="45" stroke="#00d9ff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Cloud Symbol (representing cloud infrastructure) -->
  <ellipse cx="50" cy="80" rx="10" ry="6" fill="url(#iconGrad)" opacity="0.8"/>
  <ellipse cx="43" cy="77" rx="7" ry="5" fill="url(#iconGrad)" opacity="0.8"/>
  <ellipse cx="57" cy="77" rx="7" ry="5" fill="url(#iconGrad)" opacity="0.8"/>
  <ellipse cx="50" cy="74" rx="8" ry="6" fill="url(#iconGrad)" opacity="0.8"/>
</svg>
